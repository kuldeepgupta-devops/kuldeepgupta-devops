name: Deploy Kuldeep Portfolio

on:
  push:
    branches:
      - feature
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        env:
          NODE_OPTIONS: --use-system-ca

      - name: Check build output
        run: |
          echo "=== dist ==="
          ls -la dist || true
          echo "=== dist/client ==="
          ls -la dist/client || true
          echo "=== dist/client/resume ==="
          ls -la dist/client/resume || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist/client"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          NODE_OPTIONS: --use-system-ca
